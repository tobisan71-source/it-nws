  <path d="M128 176c12 18 28 28 32 28s20-10 32-28" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <text x="160" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="1">
    <tspan fill="#FFFFFF">IT </tspan><tspan fill="#14B8A6">NWS</tspan>
  </text>
  <text x="160" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="2">Nordwestschweiz</text>
</svg>
